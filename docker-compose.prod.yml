# docker-compose.yml for Production Environment (prod branch)
services:
  backend:
    build:
      context: .
      target: production
      args:
        - NODE_ENV=production
    image: bto-backend:prod
    container_name: bto-backend-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: always
    # No volumes in production for better security and performance
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
