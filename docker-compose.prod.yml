# docker-compose.yml for Production Environment (prod branch)
services:
  backend:
    build:
      context: .
      target: production
    image: bto-backend:prod
    container_name: bto-backend-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Add other environment variables as needed
    restart: always
    # No volumes in production for better security and performance
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
