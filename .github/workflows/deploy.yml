name: CI/CD Pipeline

on:
  push:
    branches: 
      - dev
      - prod

jobs:
  deploy-to-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    name: Deploy to Development VPS
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Development VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_DEV_HOST }}
        username: ${{ secrets.VPS_DEV_USER }}
        key: ${{ secrets.VPS_DEV_KEY }}
        port: 22
        script: |
          # Ensure the working directory exists
          echo "🚀 Starting deployment to Development VPS..."
          
          # Prepare directory
          cd ~
          
          # Check if directory exists but is not a valid git repo
          if [ -d ~/bto-backend-dev ] && [ ! -d ~/bto-backend-dev/.git ]; then
            echo "�️ Found invalid repository, removing it..."
            rm -rf ~/bto-backend-dev
          fi
          
          # Clone or update repository
          if [ -d ~/bto-backend-dev ]; then
            echo "📂 Repository exists, fetching latest changes..."
            cd ~/bto-backend-dev
            git fetch origin || { echo "❌ Fetch failed, recreating repository"; rm -rf ~/bto-backend-dev; git clone -b dev https://github.com/Bombollini/bto-backend.git ~/bto-backend-dev; cd ~/bto-backend-dev; }
            git checkout dev || { echo "❌ Checkout failed, recreating repository"; rm -rf ~/bto-backend-dev; git clone -b dev https://github.com/Bombollini/bto-backend.git ~/bto-backend-dev; cd ~/bto-backend-dev; }
            git reset --hard origin/dev || { echo "❌ Reset failed, recreating repository"; rm -rf ~/bto-backend-dev; git clone -b dev https://github.com/Bombollini/bto-backend.git ~/bto-backend-dev; cd ~/bto-backend-dev; }
          else
            echo "📂 Cloning fresh repository..."
            git clone -b dev https://github.com/Bombollini/bto-backend.git ~/bto-backend-dev
            cd ~/bto-backend-dev
          fi
          
          # Verify we have the files
          echo "📋 Checking repository contents:"
          ls -la

          # Check if docker-compose file exists
          if [ ! -f docker-compose.yml ]; then
            echo "❌ docker-compose.yml not found! Content of directory:"
            ls -la
            exit 1
          fi
          
          # Stop existing containers
          echo "🛑 Stopping existing containers..."
          docker-compose down || echo "⚠️ No containers to stop or docker-compose failed"
          
          # Build and start new containers
          echo "🔨 Building and starting containers..."
          docker-compose up -d --build
          
          # Verify containers started
          if [ $? -ne 0 ]; then
            echo "❌ Failed to start containers!"
            echo "📋 Checking logs from container:"
            docker logs bto-backend-dev || echo "⚠️ Could not retrieve container logs" 
            exit 1
          fi
          
          # Clean up unused images
          echo "🧹 Cleaning up..."
          docker image prune -f
          
          # Show running containers
          echo "📊 Container status:"
          docker-compose ps
          
          echo "✅ Development deployment completed!"

  deploy-to-prod:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    name: Deploy to Production VPS
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Production VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_DEV_HOST }}
        username: ${{ secrets.VPS_DEV_USER }}
        key: ${{ secrets.VPS_DEV_KEY }}
        port: 22
        script: |
          echo "🚀 Starting deployment to Production VPS..."
          
          # Prepare directory
          cd ~
          
          # Check if directory exists but is not a valid git repo
          if [ -d ~/bto-backend-prod ] && [ ! -d ~/bto-backend-prod/.git ]; then
            echo "�️ Found invalid repository, removing it..."
            rm -rf ~/bto-backend-prod
          fi
          
          # Clone or update repository
          if [ -d ~/bto-backend-prod ]; then
            echo "📂 Repository exists, fetching latest changes..."
            cd ~/bto-backend-prod
            git fetch origin || { echo "❌ Fetch failed, recreating repository"; rm -rf ~/bto-backend-prod; git clone -b prod https://github.com/Bombollini/bto-backend.git ~/bto-backend-prod; cd ~/bto-backend-prod; }
            git checkout prod || { echo "❌ Checkout failed, recreating repository"; rm -rf ~/bto-backend-prod; git clone -b prod https://github.com/Bombollini/bto-backend.git ~/bto-backend-prod; cd ~/bto-backend-prod; }
            git reset --hard origin/prod || { echo "❌ Reset failed, recreating repository"; rm -rf ~/bto-backend-prod; git clone -b prod https://github.com/Bombollini/bto-backend.git ~/bto-backend-prod; cd ~/bto-backend-prod; }
          else
            echo "📂 Cloning fresh repository..."
            git clone -b prod https://github.com/Bombollini/bto-backend.git ~/bto-backend-prod
            cd ~/bto-backend-prod
          fi
          
          # Verify we have the files
          echo "📋 Checking repository contents:"
          ls -la
          
          # Check if docker-compose.prod.yml file exists
          if [ ! -f docker-compose.prod.yml ]; then
            echo "❌ docker-compose.prod.yml not found! Content of directory:"
            ls -la
            exit 1
          fi
          
          # Stop existing containers
          echo "🛑 Stopping existing containers..."
          docker-compose -f docker-compose.prod.yml down || echo "⚠️ No containers to stop or docker-compose failed"
          
          # Build and start new containers (production)
          echo "🔨 Building and starting production containers..."
          docker-compose -f docker-compose.prod.yml up -d --build
          
          # Verify containers started
          if [ $? -ne 0 ]; then
            echo "❌ Failed to start containers!"
            echo "📋 Checking logs from container:"
            docker logs bto-backend-prod || echo "⚠️ Could not retrieve container logs"
            exit 1
          fi
          
          # Clean up unused images
          echo "🧹 Cleaning up..."
          docker image prune -f
          
          # Show running containers
          echo "📊 Container status:"
          docker-compose -f docker-compose.prod.yml ps
          
          echo "✅ Production deployment completed!"
