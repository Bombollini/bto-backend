name: CI/CD Pipeline

on:
  push:
    branches: 
      - dev
      - prod

jobs:
  deploy-to-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    name: Deploy to Development VPS
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Development VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_DEV_HOST }}
        username: ${{ secrets.VPS_DEV_USER }}
        key: ${{ secrets.VPS_DEV_KEY }}
        port: 22
        script: |
          # Ensure the working directory exists
          echo "🚀 Starting deployment to Development VPS..."
          
          # Prepare directory
          if [ -d ~/bto-backend-dev ]; then
            echo "📂 Repository already exists, fetching latest changes..."
            cd ~/bto-backend-dev
            git fetch origin
            git checkout dev
            git reset --hard origin/dev
          else
            echo "📂 Cloning repository..."
            git clone -b dev git@github.com:Bombollini/bto-backend.git ~/bto-backend-dev
            cd ~/bto-backend-dev
          fi

          # Stop existing containers
          echo "🛑 Stopping existing containers..."
          docker-compose down
          
          # Build and start new containers
          echo "🔨 Building and starting containers..."
          docker-compose up -d --build
          
          # Clean up unused images
          echo "🧹 Cleaning up..."
          docker image prune -f
          
          # Show running containers
          echo "📊 Container status:"
          docker-compose ps
          
          echo "✅ Development deployment completed!"

  deploy-to-prod:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    name: Deploy to Production VPS
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Production VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_PROD_HOST }}
        username: ${{ secrets.VPS_PROD_USER }}
        key: ${{ secrets.VPS_PROD_KEY }}
        port: 22
        script: |
          echo "🚀 Starting deployment to Production VPS..."
          
          # Prepare directory
          if [ -d ~/bto-backend-prod ]; then
            echo "📂 Repository already exists, fetching latest changes..."
            cd ~/bto-backend-prod
            git fetch origin
            git checkout prod
            git reset --hard origin/prod
          else
            echo "📂 Cloning repository..."
            git clone -b prod https://github.com/Bombollini/bto-backend.git ~/bto-backend-prod
            cd ~/bto-backend-prod
          fi
          
          # Stop existing containers
          echo "🛑 Stopping existing containers..."
          docker-compose -f docker-compose.prod.yml down
          
          # Build and start new containers (production)
          echo "🔨 Building and starting production containers..."
          docker-compose -f docker-compose.prod.yml up -d --build
          
          # Clean up unused images
          echo "🧹 Cleaning up..."
          docker image prune -f
          
          # Show running containers
          echo "📊 Container status:"
          docker-compose -f docker-compose.prod.yml ps
          
          echo "✅ Production deployment completed!"
