# docker-compose.yml for Development Environment (dev branch)
services:
  backend:
    build:
      context: .
      target: development
    image: bto-backend:dev
    container_name: bto-backend-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      # Mount source code for hot reload in development
      - .:/app
      - /app/node_modules
    restart: always
